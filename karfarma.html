<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل کارفرما</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>body{font-family:Vazirmatn,sans-serif}.tb.on{background:#4f46e5;color:#fff}input,select{background:#fff}</style></head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><form onsubmit="return login(event)" class="bg-white rounded-2xl shadow p-6 w-full max-w-sm space-y-3">
<h1 class="text-lg font-bold text-indigo-700">ورود کارفرما</h1>
<input id="lu" placeholder="نام کاربری" class="w-full border rounded-lg p-2" dir="ltr" value="admin">
<input id="lp" type="password" placeholder="رمز عبور" class="w-full border rounded-lg p-2" dir="ltr">
<p id="le" class="text-rose-600 text-sm"></p><button class="w-full bg-indigo-600 text-white rounded-lg p-2 font-bold">ورود</button></form></div>

<div id="app" class="hidden max-w-5xl mx-auto p-3 space-y-3">
<header class="bg-indigo-600 text-white rounded-2xl p-3 flex items-center justify-between"><b>پنل کارفرما</b>
<span><button onclick="load()" class="px-3 py-1 bg-white/20 rounded-lg text-sm">به‌روزرسانی</button> <button onclick="chPw()" class="px-3 py-1 bg-white/20 rounded-lg text-sm">تغییر رمز</button> <button onclick="logout()" class="px-3 py-1 bg-white/20 rounded-lg text-sm">خروج</button></span></header>
<section id="cards" class="grid grid-cols-2 md:grid-cols-4 gap-2"></section>
<nav class="flex gap-1 overflow-x-auto text-sm" id="tabs"></nav>
<p id="err" class="text-rose-600 text-sm"></p>

<section id="p-workers" class="tp bg-white rounded-2xl p-3 space-y-2">
<div id="pend" class="hidden bg-amber-50 border border-amber-300 rounded-xl p-3 space-y-2"></div>
<form onsubmit="return addW(event)" class="grid grid-cols-2 md:grid-cols-4 gap-2">
<input id="nu" placeholder="نام کاربری (انگلیسی)" dir="ltr" class="border rounded-lg p-2 text-sm"><input id="nn" placeholder="نام نمایشی" class="border rounded-lg p-2 text-sm">
<input id="np" placeholder="رمز (حداقل ۴)" dir="ltr" class="border rounded-lg p-2 text-sm"><button class="bg-emerald-600 text-white rounded-lg p-2 text-sm font-bold">افزودن / تغییر رمز</button></form>
<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-500 text-right"><th>کاربر</th><th>نام</th><th>رکورد</th><th>تعداد</th><th>آخرین همگام‌سازی</th><th></th></tr></thead><tbody id="wt"></tbody></table></div></section>

<section id="p-records" class="tp hidden bg-white rounded-2xl p-3 space-y-2">
<div class="flex gap-2 flex-wrap"><select id="fw" onchange="recs()" class="border rounded-lg p-2 text-sm"></select><select id="fm" onchange="recs()" class="border rounded-lg p-2 text-sm"></select>
<input id="fq" oninput="draw()" placeholder="جستجوی کد/عنوان" class="border rounded-lg p-2 text-sm"><button onclick="csv()" class="bg-slate-700 text-white rounded-lg px-3 text-sm">خروجی اکسل (CSV)</button></div>
<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-500 text-right"><th>کارگر</th><th>تاریخ</th><th>کد</th><th>عنوان</th><th>تعداد</th><th>فی</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody id="rt"></tbody></table></div>
<p id="sum" class="text-sm font-bold text-indigo-700"></p></section>

<section id="p-wage" class="tp hidden bg-white rounded-2xl p-3 space-y-2">
<p class="text-xs text-slate-500">دستمزد = جمع مبلغ کارکردهای ثبت‌شده‌ی کارگر؛ مانده = دستمزد − پرداخت‌ها.</p>
<form onsubmit="return addP(event)" class="grid grid-cols-2 md:grid-cols-5 gap-2"><select id="pw" class="border rounded-lg p-2 text-sm"></select>
<input id="pa" type="number" placeholder="مبلغ پرداخت (ریال)" class="border rounded-lg p-2 text-sm"><input id="pd" placeholder="تاریخ" class="border rounded-lg p-2 text-sm"><input id="pn" placeholder="توضیح" class="border rounded-lg p-2 text-sm"><button class="bg-emerald-600 text-white rounded-lg p-2 text-sm font-bold">ثبت پرداخت</button></form>
<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-500 text-right"><th>کارگر</th><th>دستمزد</th><th>پرداختی</th><th>مانده</th></tr></thead><tbody id="gt"></tbody></table></div>
<h3 class="font-bold text-sm pt-2">سابقه‌ی پرداخت‌ها</h3><div class="overflow-x-auto"><table class="w-full text-sm"><tbody id="pt"></tbody></table></div></section>

<section id="p-rank" class="tp hidden bg-white rounded-2xl p-3 space-y-2">
<div class="flex gap-2 items-center"><select id="rm" onchange="rank()" class="border rounded-lg p-2 text-sm"></select><select id="rk" onchange="rank()" class="border rounded-lg p-2 text-sm"><option value="qty">بر اساس تعداد</option><option value="total">بر اساس ارزش</option></select></div>
<div id="rl" class="space-y-2"></div></section>

<section id="p-orders" class="tp hidden bg-white rounded-2xl p-3 space-y-2">
<form onsubmit="return addO(event)" class="grid grid-cols-2 md:grid-cols-6 gap-2"><select id="ow" class="border rounded-lg p-2 text-sm"></select>
<input id="ot" placeholder="عنوان/کد سفارش" class="border rounded-lg p-2 text-sm"><input id="oq" type="number" placeholder="تعداد" class="border rounded-lg p-2 text-sm"><input id="od" placeholder="مهلت تحویل" class="border rounded-lg p-2 text-sm"><input id="on" placeholder="توضیح" class="border rounded-lg p-2 text-sm"><button class="bg-emerald-600 text-white rounded-lg p-2 text-sm font-bold">ارجاع سفارش</button></form>
<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-500 text-right"><th>کارگر</th><th>سفارش</th><th>تعداد</th><th>مهلت</th><th>وضعیت</th><th></th></tr></thead><tbody id="ot2"></tbody></table></div></section>
</div>

<script>
const API = localStorage.kf_api || location.origin, $ = id => document.getElementById(id), fa = n => Number(n || 0).toLocaleString('fa-IR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS = [['workers', 'کارگران'], ['records', 'کارکردها'], ['wage', 'دستمزد و پرداخت'], ['rank', 'رتبه‌بندی'], ['orders', 'سفارش‌ها']];
let R = [], W = [], A = [];
async function api(p, m = 'GET', b) {
  const r = await fetch(API + '/api/' + p, { method: m, headers: { Authorization: 'Bearer ' + (localStorage.kf_token || '') }, body: b ? JSON.stringify(b) : undefined });
  const j = await r.json().catch(() => ({})); if (r.status === 401 && p !== 'login') logout(); if (!r.ok) throw new Error(j.error || 'خطا'); return j;
}
const act = async f => { try { $('err').textContent = ''; await f(); } catch (x) { $('err').textContent = x.message; } return false; };
function tab(t) { document.querySelectorAll('.tp').forEach(e => e.classList.toggle('hidden', e.id !== 'p-' + t)); document.querySelectorAll('.tb').forEach(e => e.classList.toggle('on', e.dataset.t === t)); localStorage.kf_tab = t; }
$('tabs').innerHTML = TABS.map(([k, v]) => `<button data-t="${k}" onclick="tab('${k}')" class="tb shrink-0 px-3 py-2 rounded-lg bg-white">${v}</button>`).join('');
const login = e => (e.preventDefault(), act(async () => { try {
  const j = await api('login', 'POST', { username: $('lu').value, password: $('lp').value });
  if (j.role !== 'admin') throw new Error('این حساب کارفرما نیست'); localStorage.kf_token = j.token; start();
} catch (x) { $('le').textContent = x.message; } }));
function logout() { localStorage.removeItem('kf_token'); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
function start() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); tab(localStorage.kf_tab || 'workers'); load(); }
const opts = (sel, first) => (first ? `<option value="">${first}</option>` : '') + W.map(x => `<option value="${esc(x.username)}">${esc(x.name)} (${esc(x.username)})</option>`).join('');
const nm = u => { const x = W.find(w => w.username === u); return x ? x.name + ' (' + u + ')' : u; };
async function load() { act(async () => {
  W = await api('workers'); const m = await api('months'); drawPend(await api('pending'));
  const t = W.reduce((a, x) => (a.r += x.records, a.v += x.total, a.p += x.paid, a), { r: 0, v: 0, p: 0 });
  $('cards').innerHTML = [['کارگران', W.length], ['کل رکوردها', t.r], ['کل دستمزد (ریال)', t.v], ['مانده‌ی بدهی (ریال)', t.v - t.p]].map(([a, b]) => `<div class="bg-white rounded-2xl p-3"><div class="text-xs text-slate-500">${a}</div><div class="text-xl font-bold text-indigo-700">${fa(b)}</div></div>`).join('');
  $('wt').innerHTML = W.map(x => `<tr class="border-t"><td dir="ltr">${esc(x.username)}</td><td>${esc(x.name)}</td><td>${fa(x.records)}</td><td>${fa(x.qty)}</td><td>${x.last_sync ? new Date(x.last_sync).toLocaleString('fa-IR') : '—'}</td><td><button onclick="delW('${esc(x.username)}')" class="text-rose-600">حذف</button></td></tr>`).join('') || '<tr><td colspan=6 class="text-slate-400 p-2">هنوز کارگری اضافه نشده</td></tr>';
  const keep = [$('fw').value, $('fm').value, $('rm').value];
  $('fw').innerHTML = opts(0, 'همه‌ی کارگران'); $('pw').innerHTML = opts(); $('ow').innerHTML = opts(); $('fw').value = keep[0];
  const mo = f => `<option value="">${f}</option>` + m.map(x => `<option>${esc(x.month)}</option>`).join('');
  $('fm').innerHTML = mo('همه‌ی ماه‌ها'); $('rm').innerHTML = mo('همه‌ی ماه‌ها'); $('fm').value = keep[1]; $('rm').value = keep[2];
  $('gt').innerHTML = W.map(x => `<tr class="border-t"><td>${esc(nm(x.username))}</td><td>${fa(x.total)}</td><td>${fa(x.paid)}</td><td class="font-bold ${x.total - x.paid > 0 ? 'text-rose-600' : 'text-emerald-600'}">${fa(x.total - x.paid)}</td></tr>`).join('');
  const P = await api('payments'); $('pt').innerHTML = P.map(p => `<tr class="border-t"><td>${esc(nm(p.worker))}</td><td>${fa(p.amount)}</td><td>${esc(p.date)}</td><td>${esc(p.note)}</td><td><button onclick="del('payments/${p.id}')" class="text-rose-600">حذف</button></td></tr>`).join('');
  const L = { new: 'جدید', doing: 'در حال انجام', done: 'تحویل‌شده' }; const O = await api('orders');
  $('ot2').innerHTML = O.map(o => `<tr class="border-t"><td>${esc(nm(o.worker))}</td><td>${esc(o.title)}<div class="text-xs text-slate-400">${esc(o.note)}</div></td><td>${fa(o.qty)}</td><td>${esc(o.due)}</td><td><select onchange="setO(${o.id},this.value)" class="border rounded p-1">${Object.entries(L).map(([k, v]) => `<option value="${k}" ${o.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td><td><button onclick="del('orders/${o.id}')" class="text-rose-600">حذف</button></td></tr>`).join('') || '<tr><td colspan=6 class="text-slate-400 p-2">سفارشی ثبت نشده</td></tr>';
  await recs(); rank(); }); }
function drawPend(L) {
  const b = document.querySelector('.tb[data-t=workers]'); if (b) b.textContent = 'کارگران' + (L.length ? ' 🔔 ' + fa(L.length) : '');
  $('pend').classList.toggle('hidden', !L.length);
  $('pend').innerHTML = L.length ? '<b class="text-sm text-amber-800">درخواست ثبت‌نام کارگر (' + fa(L.length) + ')</b>' + L.map(x => `<div class="flex items-center justify-between gap-2 bg-white rounded-lg p-2 text-sm"><span>${esc(x.name)} <span dir="ltr" class="text-slate-400">(${esc(x.username)})</span></span><span class="shrink-0"><button onclick="apprW('${esc(x.username)}')" class="bg-emerald-600 text-white rounded-lg px-3 py-1">تأیید</button> <button onclick="rejW('${esc(x.username)}')" class="text-rose-600 px-2">رد</button></span></div>`).join('') : '';
}
const apprW = u => act(async () => { await api('pending/' + encodeURIComponent(u), 'POST'); load(); });
const rejW = u => confirm('درخواست «' + u + '» رد شود؟') && act(async () => { await api('pending/' + encodeURIComponent(u), 'DELETE'); load(); });
async function recs() { R = await api('records?worker=' + encodeURIComponent($('fw').value) + '&month=' + encodeURIComponent($('fm').value)).catch(() => []); draw(); }
const flt = () => { const q = $('fq').value.trim().toLowerCase(); return R.filter(r => !q || (r.itemCode + ' ' + r.itemTitle).toLowerCase().includes(q)); };
function draw() { const L = flt();
  $('rt').innerHTML = L.slice(0, 500).map(r => `<tr class="border-t"><td>${esc(nm(r.worker))}</td><td>${esc(r.date)}</td><td>${esc(r.itemCode)}</td><td>${esc(r.itemTitle)}</td><td>${fa(r.quantity)}</td><td>${r.unitPrice ? fa(r.unitPrice) : '—'}</td><td>${r.totalPrice != null ? fa(r.totalPrice) : '—'}</td><td>${esc(r.status)}</td></tr>`).join('');
  $('sum').textContent = `${fa(L.length)} رکورد | جمع تعداد: ${fa(L.reduce((a, r) => a + (+r.quantity || 0), 0))} | جمع مبلغ: ${fa(L.reduce((a, r) => a + (+r.totalPrice || 0), 0))} ریال`; }
function csv() { const c = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = [['کارگر', 'تاریخ', 'کد', 'عنوان', 'تعداد', 'فی', 'مبلغ', 'وضعیت']].concat(flt().map(r => [r.worker, r.date, r.itemCode, r.itemTitle, r.quantity, r.unitPrice, r.totalPrice, r.status]));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(c).join(',')).join('\n')], { type: 'text/csv' })); a.download = 'karkard.csv'; a.click(); }
async function rank() { const rs = await api('records?month=' + encodeURIComponent($('rm').value)).catch(() => []), k = $('rk').value, g = {};
  rs.forEach(r => { const x = g[r.worker] = g[r.worker] || { qty: 0, total: 0, n: 0 }; x.qty += +r.quantity || 0; x.total += +r.totalPrice || 0; x.n++; });
  const L = Object.entries(g).sort((a, b) => b[1][k] - a[1][k]), mx = L.length ? L[0][1][k] || 1 : 1;
  $('rl').innerHTML = L.map(([u, x], i) => `<div><div class="flex justify-between text-sm"><span>${['🥇', '🥈', '🥉'][i] || fa(i + 1) + '.'} ${esc(nm(u))}</span><span>${fa(x.qty)} عدد | ${fa(x.total)} ریال | ${fa(x.n)} رکورد</span></div><div class="h-2 bg-slate-200 rounded"><div class="h-2 bg-indigo-500 rounded" style="width:${Math.round(x[k] / mx * 100)}%"></div></div></div>`).join('') || '<p class="text-slate-400 text-sm">داده‌ای نیست</p>'; }
const addW = e => (e.preventDefault(), act(async () => { await api('workers', 'POST', { username: $('nu').value, name: $('nn').value, password: $('np').value }); e.target.reset(); load(); }));
const addP = e => (e.preventDefault(), act(async () => { await api('payments', 'POST', { worker: $('pw').value, amount: $('pa').value, date: $('pd').value, note: $('pn').value }); e.target.reset(); load(); }));
const addO = e => (e.preventDefault(), act(async () => { await api('orders', 'POST', { worker: $('ow').value, title: $('ot').value, qty: $('oq').value, due: $('od').value, note: $('on').value }); e.target.reset(); load(); }));
const setO = (id, status) => act(() => api('orders/' + id, 'PUT', { status }));
const chPw = () => act(async () => { const o = prompt('رمز فعلی:'); if (!o) return; const n = prompt('رمز جدید (حداقل ۶ کاراکتر):'); if (!n) return; await api('password', 'POST', { old: o, new: n }); alert('رمز تغییر کرد.'); });
const del = p => confirm('حذف شود؟') && act(async () => { await api(p, 'DELETE'); load(); });
const delW = u => act(async () => { if (!confirm('حساب «' + u + '» حذف شود؟')) return; const p = confirm('رکوردهای این کارگر هم از دیتابیس پاک شود؟\n(تأیید = پاک شود، انصراف = فقط حساب حذف شود)'); await api('workers/' + encodeURIComponent(u) + (p ? '?purge=1' : ''), 'DELETE'); load(); });
if (localStorage.kf_token) start();
setInterval(() => localStorage.kf_token && !$('app').classList.contains('hidden') && load(), 30000);
</script></body></html>
